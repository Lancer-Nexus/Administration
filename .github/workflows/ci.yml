name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore LancerNexus.Administration.sln
      - run: dotnet build LancerNexus.Administration.sln --configuration Release --no-restore
      - run: dotnet test LancerNexus.Administration.sln --configuration Release --no-build --verbosity normal
